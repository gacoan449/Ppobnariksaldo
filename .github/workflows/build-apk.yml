name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate and normalize APK
        shell: bash
        run: |
          set -euo pipefail
          echo "APK files produced by Gradle:"
          find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print

          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          cp "$APK_PATH" app-release.apk
          echo "Normalized APK: app-release.apk"
          ls -lh app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Digiflazz-Balance-Emptier
          path: app-release.apk
          if-no-files-found: error
